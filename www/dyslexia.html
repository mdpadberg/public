<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dyslexia Reading Simulator</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --primary-color: #bb86fc;
            --secondary-color: #03dac6;
            --error-color: #cf6679;
            --input-bg: #2c2c2c;
            --border-color: #333;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            background: var(--input-bg);
            padding: 15px;
            border-radius: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--secondary-color);
        }

        textarea {
            width: 100%;
            height: 120px;
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.9rem;
            resize: vertical;
        }

        #display-area {
            min-height: 200px;
            padding: 15px;
            border: 2px solid var(--primary-color);
            border-radius: 12px;
            background: var(--bg-color);
            line-height: 1.8;
            font-size: 1.1rem;
            white-space: pre-wrap;
            margin-bottom: 10px;
        }

        /* ADDED HIGHLIGHT STYLE */
        .word-changed {
            background-color: rgba(187, 134, 252, 0.3);
            border-bottom: 2px solid var(--primary-color);
            border-radius: 3px;
            padding: 0 2px;
            transition: background-color 0.3s ease;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        button {
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active { transform: scale(0.95); }

        #start-btn { background-color: var(--secondary-color); color: #000; }
        #reset-btn { background-color: var(--error-color); color: #fff; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: var(--input-bg);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            border: 1px solid var(--border-color);
        }

        .stats-bar span {
            color: var(--primary-color);
            font-weight: bold;
        }

        .status {
            text-align: center;
            font-size: 0.8rem;
            margin-top: 10px;
            color: #888;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.2rem; }
            .container { padding: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Dyslexia Simulator</h1>
    
    <div class="controls">
        <div class="control-group">
            <label>Change Speed: <span id="speed-val">60</span>s</label>
            <input type="range" id="speed-slider" min="1" max="60" value="60">
        </div>
        <div class="control-group">
            <label>Scramble Intensity: <span id="intensity-val">2</span>%</label>
            <input type="range" id="intensity-slider" min="1" max="100" value="2">
        </div>
    </div>

    <label>Input Text:</label>
    <textarea id="input-text" placeholder="Enter text here...">Reading is something many people take for granted.

For some people with dyslexia, reading can require much more concentration and effort. This simulator intentionally mixes letters inside words to give a rough impression of how reading may become slower and more mentally demanding.

Remember that dyslexia affects everyone differently. This demonstration represents only one possible aspect of the experience.</textarea>

    <div class="buttons">
        <button id="start-btn">Start</button>
        <button id="reset-btn">Reset</button>
    </div>

    <p class="status" id="status-msg">Ready.</p>

    <h3 style="font-size: 1rem; margin-top: 20px;">Simulated View:</h3>
    <div id="display-area">Your simulated text will appear here...</div>
    
    <div class="stats-bar">
        <div>Total Words: <span id="total-words-count">0</span></div>
        <div>Words Changed: <span id="total-changed-count">0</span></div>
    </div>
</div>

<script>
    const inputText = document.getElementById('input-text');
    const displayArea = document.getElementById('display-area');
    const speedSlider = document.getElementById('speed-slider');
    const intensitySlider = document.getElementById('intensity-slider');
    const speedVal = document.getElementById('speed-val');
    const intensityVal = document.getElementById('intensity-val');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const statusMsg = document.getElementById('status-msg');
    
    const totalWordsDisplay = document.getElementById('total-words-count');
    const totalChangedDisplay = document.getElementById('total-changed-count');

    let intervalId = null;
    let cumulativeChanges = 0;

    speedSlider.oninput = () => speedVal.innerText = speedSlider.value;
    intensitySlider.oninput = () => intensityVal.innerText = intensitySlider.value;

    function scrambleText() {
        const originalText = inputText.value;
        const intensity = parseInt(intensitySlider.value);
        
        const parts = originalText.split(/(\s+)/);
        let currentCycleChanges = 0;

        const scrambledParts = parts.map(part => {
            // If it's whitespace, return as is
            if (/\s+/.test(part)) return part;

            let wordArr = part.split('');
            let wasChanged = false; // Flag to check if this specific word changed
            
            // Only scramble if word is 4+ letters (to allow inner swaps)
            if (wordArr.length >= 4) {
                const innerStart = 1;
                const innerEnd = wordArr.length - 2;

                for (let i = innerStart; i <= innerEnd; i++) {
                    if (Math.random() < (intensity / 100)) {
                        let swapIdx = Math.floor(Math.random() * (innerEnd - innerStart + 1)) + innerStart;
                        
                        if (i !== swapIdx) {
                            let temp = wordArr[i];
                            wordArr[i] = wordArr[swapIdx];
                            wordArr[swapIdx] = temp;
                            
                            wasChanged = true;
                            currentCycleChanges++;
                        }
                    }
                }
            }
            
            let result = wordArr.join('');
            
            // If this word was modified, wrap it in a highlight span
            if (wasChanged) {
                return `<span class="word-changed">${result}</span>`;
            }
            return result;
        });

        // Use innerHTML to render the spans
        displayArea.innerHTML = scrambledParts.join('');
        
        cumulativeChanges += currentCycleChanges;
        totalChangedDisplay.innerText = cumulativeChanges;
    }

    function updateTotalWordCount() {
        const text = inputText.value.trim();
        const count = text ? text.split(/\s+/).length : 0;
        totalWordsDisplay.innerText = count;
    }

    updateTotalWordCount();

    startBtn.onclick = () => {
        if (intervalId) clearInterval(intervalId);
        
        cumulativeChanges = 0;
        totalChangedDisplay.innerText = "0";

        scrambleText();
        
        const speed = parseInt(speedSlider.value) * 1000;
        intervalId = setInterval(scrambleText, speed);
        
        statusMsg.innerText = `Simulation running. Changing every ${speedSlider.value}s.`;
        startBtn.disabled = true;
        startBtn.style.opacity = "0.5";
    };

    resetBtn.onclick = () => {
        if (intervalId) clearInterval(intervalId);
        
        displayArea.innerHTML = "Your simulated text will appear here...";
        statusMsg.innerText = "Simulation stopped. Click Start to begin.";
        startBtn.disabled = false;
        startBtn.style.opacity = "1";
        
        cumulativeChanges = 0;
        totalChangedDisplay.innerText = "0";
        updateTotalWordCount();
    };

    inputText.addEventListener('input', updateTotalWordCount);
</script>

</body>
</html>
